# ==============================================================================
# Render Blueprint Configuration (render.yaml)
# ==============================================================================
# Deploys both the FastAPI Backend Web Service and a Managed PostgreSQL Database.
# ==============================================================================
databases:
  - name: messenger-db
    databaseName: messenger
    user: messenger_user
    plan: free
    region: oregon # or frankfurt, ohio, singapore
    ipAllowList: [] # only allow internal services by default

services:
  - type: web
    name: messenger-backend
    env: python
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: messenger-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 43200
      - key: CORS_ORIGINS
        value: "*"
      - key: STUN_SERVER
        value: "stun:stun.l.google.com:19302"
      - key: STORAGE_PROVIDER
        value: "local"
      - key: LOCAL_UPLOAD_DIR
        value: "uploads"
      # For production S3 / Cloudflare R2:
      # - key: STORAGE_PROVIDER
      #   value: "s3"
      # - key: STORAGE_BUCKET
      #   sync: false
      # - key: STORAGE_ACCESS_KEY
      #   sync: false
      # - key: STORAGE_SECRET_KEY
      #   sync: false
      # - key: STORAGE_ENDPOINT_URL
      #   sync: false
      # - key: STORAGE_PUBLIC_URL_PREFIX
      #   sync: false
